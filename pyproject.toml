[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resauce"
version = "0.1.0"
description = "Computational proof of concept for checking whether clinical research records match their source documents (synthetic data only)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the top-level tools/ package (case-authoring tools).
pythonpath = ["."]
